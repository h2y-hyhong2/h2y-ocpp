# ==============================================================================
# ELVIS-CSMS Admin REST API (elvis-control-api) Configuration
# 위치: config/control-api/application.yml
# ==============================================================================

server:
  port: ${ELVIS_API_PORT:9082}

spring:
  application:
    name: elvis-control-api

  # RDBMS (MySQL 9.71) 접속 설정
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:13306}/${DB_NAME:elvis-lite}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:elvis}
    password: ${MYSQL_PASSWORD:elvis1234!}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: ElvisControlApiHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  # ClickHouse 시계열 DB 연동
  clickhouse:
    url: jdbc:ch://${CLICKHOUSE_HOST:localhost}:${CLICKHOUSE_PORT:8123}/elvis_analytics
    user: ${CLICKHOUSE_USER:default}
    password: ${CLICKHOUSE_PASSWORD:}

  # Kafka 메시징 연동 (하향 제어 명령 발행)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

elvis:
  jwt:
    secret: "elvis-csms-poc-jwt-super-secret-key-2026-very-long-secure-key"
    expiration-ms: 86400000

logging:
  level:
    root: INFO
    com.lselink.elvis.control.api: DEBUG
