server:
  port: ${ELVIS_WS_PORT:${WS_PORT:9080}}

spring:
  application:
    name: elvis-connect-ws
  devtools:
    restart:
      enabled: ${ELVIS_DEVTOOLS_RESTART_ENABLED:true}
      poll-interval: 1s
      quiet-period: 400ms
    livereload:
      enabled: false
  threads:
    virtual:
      enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1
      retries: 3
      batch-size: 16384
      buffer-memory: 33554432
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: elvis-connect-ws-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "com.lselink.elvis.*"

elvis:
  gateway:
    websocket:
      path: "/ocpp/{chargeBoxId}"
      subprotocols:
        - "ocpp1.6"
        - "ocpp1.5"
      buffer-size-bytes: ${ELVIS_WS_BUFFER_SIZE_BYTES:65536}
      idle-timeout-seconds: ${ELVIS_WS_IDLE_TIMEOUT_SECONDS:360}
      ping-interval-seconds: ${ELVIS_WS_PING_INTERVAL_SECONDS:30}
      require-auth: false
    kafka:
      inbound-topic: "ocpp-raw-events"
      outbound-topic: "ocpp-outbound-commands"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.lselink.elvis.connect.ws: DEBUG
