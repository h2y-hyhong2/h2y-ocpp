server:
  port: ${ELVIS_API_PORT:${API_PORT:9082}}

spring:
  application:
    name: elvis-control-api
  devtools:
    restart:
      enabled: ${ELVIS_DEVTOOLS_RESTART_ENABLED:true}
      poll-interval: 1s
      quiet-period: 400ms
    livereload:
      enabled: false

  # RDBMS (MySQL 9.71) 접속 설정
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:13306}/${DB_NAME:elvis_lite}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:elvis}
    password: ${MYSQL_PASSWORD:elvis1234!}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: ElvisControlApiHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: none

  # Kafka Consumer & Producer 설정 (Sprint 28 / Sprint 31: S31-API-0050-CO)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:elvis-control-group}
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
      retries: 3

# CSMS Lite 관제 알림, 하향 커맨드 및 JWT 보안 설정
elvis:
  control:
    kafka:
      notification-topic: ${KAFKA_NOTIFICATION_TOPIC:ocpp-ui-notifications}
      outbound-topic: ${KAFKA_OUTBOUND_TOPIC:ocpp-outbound-commands}
    notification:
      buffer-size: ${NOTIFICATION_BUFFER_SIZE:50}
    ws-gateway:
      enabled: ${ELVIS_WS_SESSION_CHECK_ENABLED:true}
      base-url: ${ELVIS_WS_BASE_URL:http://localhost:${ELVIS_WS_PORT:9080}}
      connect-timeout-ms: ${ELVIS_WS_CONNECT_TIMEOUT_MS:500}
      read-timeout-ms: ${ELVIS_WS_READ_TIMEOUT_MS:800}
      cache-ttl-ms: ${ELVIS_WS_CACHE_TTL_MS:1000}
    api-logging:
      enabled: ${ELVIS_API_LOGGING_ENABLED:true}
    jwt:
      secret: ${JWT_SECRET:c2VjdXJlLWVsdmlzLWNzbXMtbGl0ZS1qd3Qta2V5LTIwMjYtMjU2Yml0LXNlY3JldA==}
      access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY:3600}
      refresh-token-validity-seconds: ${JWT_REFRESH_TOKEN_VALIDITY:604800}

# P6Spy SQL 파라미터 인라인 치환 및 Pretty 포매팅 설정
decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: true
      logging: slf4j

logging:
  level:
    root: INFO
    com.lselink.elvis.control: DEBUG
    p6spy: INFO
