server:
  port: ${API_PORT:9082}

spring:
  application:
    name: elvis-control-api

  # RDBMS (MySQL 9.71) 접속 설정
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:13306}/${DB_NAME:elvis_lite}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:elvis}
    password: ${MYSQL_PASSWORD:elvis1234!}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: ElvisControlApiHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: none

  # Kafka Consumer 설정 (Sprint 28: S28-API-0060-CO)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:elvis-control-group}
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# CSMS Lite 관제 알림 및 ClickHouse 설정
elvis:
  control:
    kafka:
      notification-topic: ${KAFKA_NOTIFICATION_TOPIC:ocpp-ui-notifications}
    notification:
      buffer-size: ${NOTIFICATION_BUFFER_SIZE:50}
  clickhouse:
    enabled: ${CLICKHOUSE_ENABLED:false}
    url: jdbc:ch://${CLICKHOUSE_HOST:localhost}:${CLICKHOUSE_PORT:8123}/${CLICKHOUSE_DB:elvis_poc}
    user: ${CLICKHOUSE_USER:default}
    password: ${CLICKHOUSE_PASSWORD:}
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
    maximum-pool-size: 15
    minimum-idle: 5
    connection-timeout-ms: 5000
    socket-timeout-ms: 10000

# P6Spy SQL 파라미터 인라인 치환 및 Pretty 포매팅 설정
decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: true
      logging: slf4j

logging:
  file:
    name: ${ELVIS_LOG_DIR:D:/elvis-lite/logs}/api.log
  level:
    root: INFO
    com.lselink.elvis.control: DEBUG
    p6spy: INFO
