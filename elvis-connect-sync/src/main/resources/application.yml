server:
  port: 18081

spring:
  application:
    name: elvis-connect-sync
  threads:
    virtual:
      enabled: true

  # ─── MySQL DataSource (Sprint 18: 실시간 상태 UPDATE) ─────────────────────────
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:13306}/${MYSQL_DATABASE:elvis_lite}?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER:elvis}
    password: ${MYSQL_PASSWORD:elvis1234!}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: elvis-sync-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        show_sql: false

  # ─── Redis Cache (Sprint 20: S20-SYNC-0070-CO) ────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 100ms

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: elvis-connect-sync-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.lselink.elvis.connect.sync.dto.OcppRawEventEnvelope
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

elvis:
  sync:
    kafka:
      inbound-topic: ocpp-raw-events
      outbound-topic: ocpp-outbound-commands
      notification-topic: ${ELVIS_NOTIFICATION_TOPIC:ocpp-ui-notifications}
      dlt-topic: ${ELVIS_DLT_TOPIC:ocpp-dlt}
    fault:
      flapping-window-seconds: 60

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
