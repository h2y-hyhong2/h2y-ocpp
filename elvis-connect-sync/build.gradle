plugins {
    id 'org.springframework.boot'
}

dependencies {
    // OCPP Core (외부 독립 저장소 - Composite Build)
    implementation 'com.lselink.ocpp:ocpp_core'

    // Spring Boot Starter
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Spring Data JPA + MySQL (Sprint 18: 실시간 상태 UPDATE)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Flyway - DB 마이그레이션 (Sprint 18: DDL 스키마 자동 적용)
    implementation 'org.flywaydb:flyway-mysql'

    // Spring Kafka
    implementation 'org.springframework.kafka:spring-kafka'

    // Cache: L1 (Caffeine) & L2 (Redis) - Sprint 20: S20-SYNC-0070-CO
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // JSON Processing
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Metrics (Micrometer)
    implementation 'io.micrometer:micrometer-core'
    implementation 'io.micrometer:micrometer-registry-prometheus'
}
